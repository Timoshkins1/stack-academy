<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc"><title id="title">СТЭК ACADEMY — руководство преподавателя и редактора</title><desc id="desc">30 уроков по 60 минут. Курсы START, CORE и PRO.</desc><rect width="1280" height="300" rx="20" fill="#18221c"/><path d="M875 0h405v300H875z" fill="#213c2d"/><path d="M875 0v300" stroke="#52624b"/><g transform="translate(48 41)" fill="none" stroke="#d6bc82" stroke-width="3" stroke-linejoin="round"><path d="M0 15 24 2l24 13-24 13z"/><path d="m0 27 24 13 24-13M0 39l24 13 24-13"/></g><g font-family="Arial,Helvetica,sans-serif"><text x="115" y="69" fill="#f0f1e8" font-size="32" font-weight="700" letter-spacing="3">СТЭК ACADEMY</text><text x="49" y="146" fill="#f0f1e8" font-size="35" font-weight="600">Руководство преподавателя</text><text x="49" y="191" fill="#f0f1e8" font-size="35" font-weight="600">и редактора приложения</text><text x="49" y="251" fill="#b3c3ae" font-size="17">Провести занятие. Разобрать решение. Развить программу.</text><text x="925" y="56" fill="#d6bc82" font-size="16">30 уроков по 60 минут</text><g font-size="29" font-weight="700"><text x="925" y="110" fill="#d2e1c8">START</text><text x="925" y="170" fill="#e1cba0">CORE</text><text x="925" y="230" fill="#c6d5db">PRO</text></g><g font-size="14" fill="#c0cbbb"><text x="1125" y="107">8 уроков</text><text x="1125" y="167">12 уроков</text><text x="1125" y="227">10 уроков</text></g><path d="M925 127h300M925 187h300" stroke="#4d6550"/></g></svg>
